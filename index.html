<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temple Run: True Spirit Beasts</title>
    <style>
        body {
            background-color: #060913;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        h1 {
            font-size: 1.4rem;
            color: #fbbf24;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }
        p {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 0;
            margin-bottom: 12px;
            text-align: center;
        }
        canvas {
            background: linear-gradient(to right, #0f172a, #1e1b4b, #0f172a);
            border: 3px solid #fbbf24;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

    <h1>TEMPLE RUN: TRUE SPIRIT BEASTS</h1>
    <p>Controls: ⬆️ ⬇️ Switch Tracks | <b>Space</b> Jump | <b>Shift</b> Slide<br><b>Press [ C ] to change Animal (Lion, Eagle, Fox, Panther)!</b></p>
    <canvas id="gameCanvas" width="700" height="420"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const tracks = [140, 240, 340];

        let gameState = 'RUNNING';
        let speed = 6;
        let frameCount = 0;
        let score = 0;
        let totalCoins = 0;

        // Distinct Animal Skins
        const skins = [
            { id: 'lion', name: 'Golden Lion', primary: '#f59e0b', secondary: '#b45309', accent: '#fbbf24' },
            { id: 'eagle', name: 'Sky Eagle', primary: '#38bdf8', secondary: '#0369a1', accent: '#f8fafc' },
            { id: 'fox', name: 'Flame Fox', primary: '#f97316', secondary: '#c2410c', accent: '#ffedd5' },
            { id: 'panther', name: 'Shadow Panther', primary: '#475569', secondary: '#1e293b', accent: '#a855f7' }
        ];
        let currentSkinIndex = 0;

        let shakeTimer = 0;
        let shakeIntensity = 0;

        // Audio Synth
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(380, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        let player = {
            track: 1,
            x: 120,
            y: tracks[1],
            jumpVel: 0,
            gravity: 0.65,
            isJumping: false,
            isSliding: false,
            slideTimer: 0
        };

        let obstacles = [];
        let coins = [];
        let particles = [];
        let backgroundPillars = [];

        for (let i = 0; i < 5; i++) {
            backgroundPillars.push({ x: i * 180, width: 45, height: 350 });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') {
                currentSkinIndex = (currentSkinIndex + 1) % skins.length;
                playSound('coin');
                return;
            }

            if (gameState === 'GAMEOVER') {
                if (e.code === 'Space' || e.key === 'r') {
                    resetGame();
                }
                return;
            }

            if (e.key === 'ArrowUp' || e.key === 'w') {
                if (player.track > 0) player.track--;
            }
            if (e.key === 'ArrowDown' || e.key === 's') {
                if (player.track < 2) player.track++;
            }

            if ((e.code === 'Space' || e.key === ' ') && !player.isJumping && !player.isSliding) {
                player.isJumping = true;
                player.jumpVel = -13;
                playSound('jump');
                spawnDust(player.x, tracks[player.track] + 20, skins[currentSkinIndex].primary);
            }
            if (e.key === 'Shift' && !player.isJumping && !player.isSliding) {
                player.isSliding = true;
                player.slideTimer = 30;
                spawnDust(player.x, tracks[player.track] + 20, '#fbbf24');
            }
        });

        function spawnDust(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: -Math.random() * 3 - 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: Math.random() * 3 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function spawnEntities() {
            frameCount++;
            if (frameCount % 60 === 0) {
                let track = Math.floor(Math.random() * 3);
                let type = Math.random() < 0.5 ? 'spike' : 'barrier';
                obstacles.push({
                    track: track,
                    x: canvas.width + 50,
                    type: type
                });
            }
            if (frameCount % 40 === 0) {
                let track = Math.floor(Math.random() * 3);
                coins.push({
                    track: track,
                    x: canvas.width + 50,
                    radius: 10
                });
            }
        }

        function resetGame() {
            obstacles = [];
            coins = [];
            particles = [];
            score = 0;
            frameCount = 0;
            totalCoins = 0;
            player.track = 1;
            player.y = tracks[1];
            player.isJumping = false;
            player.isSliding = false;
            shakeTimer = 0;
            gameState = 'RUNNING';
        }

        function update() {
            if (gameState !== 'RUNNING') return;

            score++;
            speed = 6 + Math.floor(score / 250);

            if (shakeTimer > 0) shakeTimer--;

            backgroundPillars.forEach(p => {
                p.x -= speed * 0.4;
                if (p.x + p.width < 0) p.x = canvas.width + 50;
            });

            let targetY = tracks[player.track];

            if (player.isJumping) {
                player.jumpVel += player.gravity;
                player.y += player.jumpVel;
                if (player.y >= targetY) {
                    player.y = targetY;
                    player.isJumping = false;
                    player.jumpVel = 0;
                    spawnDust(player.x, targetY + 20, skins[currentSkinIndex].primary);
                }
            } else {
                player.y += (targetY - player.y) * 0.3;
            }

            if (player.isSliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) player.isSliding = false;
            }

            spawnEntities();

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.x -= speed;
                let cY = tracks[c.track];

                if (Math.abs(c.x - player.x) < 30 && Math.abs(cY - player.y) < 30) {
                    totalCoins++;
                    playSound('coin');
                    spawnDust(player.x, player.y, '#fbbf24');
                    coins.splice(i, 1);
                    continue;
                }
                if (c.x < -30) coins.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= speed;

                if (obs.track === player.track && Math.abs(obs.x - player.x) < 30) {
                    let hit = false;
                    if (obs.type === 'spike' && !player.isJumping) hit = true;
                    if (obs.type === 'barrier' && !player.isSliding) hit = true;

                    if (hit) {
                        gameState = 'GAMEOVER';
                        playSound('hit');
                        shakeTimer = 20;
                        shakeIntensity = 12;
                        spawnDust(player.x, player.y, '#ef4444');
                    }
                }
                if (obs.x < -50) obstacles.splice(i, 1);
            }
        }

        // Draw Distinct Animal Silhouettes (Lion, Eagle, Fox, Panther)
        function drawAnimal(x, y, skin, isSliding, frame) {
            ctx.save();
            ctx.translate(x, y);

            let skinId = skin.id;

            if (skinId === 'lion') {
                // LION: Golden mane & body
                ctx.fillStyle = skin.secondary;
                ctx.beginPath();
                ctx.arc(-10, -12, 18, 0, Math.PI * 2); // Mane
                ctx.fill();

                ctx.fillStyle = skin.primary;
                ctx.fillRect(-22, isSliding ? -10 : -20, 44, isSliding ? 20 : 32); // Body
                ctx.beginPath();
                ctx.arc(14, isSliding ? 0 : -16, 12, 0, Math.PI * 2); // Head
                ctx.fill();
                // Tail
                ctx.strokeStyle = skin.primary;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-22, -10);
                ctx.quadraticCurveTo(-38, -25 + Math.sin(frame*0.2)*6, -32, -5);
                ctx.stroke();

            } else if (skinId === 'eagle') {
                // EAGLE: Soaring wings & beak
                ctx.fillStyle = skin.primary;
                ctx.beginPath();
                ctx.ellipse(0, isSliding ? -5 : -15, 26, 14, 0, 0, Math.PI * 2);
                ctx.fill();
                // Wings flapping
                ctx.fillStyle = skin.secondary;
                let wingAngle = Math.sin(frame * 0.3) * 15;
                ctx.beginPath();
                ctx.moveTo(-5, -15);
                ctx.lineTo(10, -35 + wingAngle);
                ctx.lineTo(20, -15);
                ctx.fill();
                // Beak
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.moveTo(22, -18);
                ctx.lineTo(30, -14);
                ctx.lineTo(22, -10);
                ctx.fill();

            } else if (skinId === 'fox') {
                // FOX: Pointy ears & long tail
                ctx.fillStyle = skin.primary;
                ctx.fillRect(-20, isSliding ? -10 : -22, 40, isSliding ? 20 : 30);
                // Head & pointy ears
                ctx.beginPath();
                ctx.arc(12, isSliding ? 0 : -18, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(8, -26); ctx.lineTo(12, -34); ctx.lineTo(16, -26);
                ctx.fill();
                // Bushy tail
                ctx.fillStyle = skin.accent;
                ctx.beginPath();
                ctx.ellipse(-24, -12 + Math.sin(frame*0.2)*5, 16, 8, Math.PI/6, 0, Math.PI*2);
                ctx.fill();

            } else if (skinId === 'panther') {
                // PANTHER: Sleek dark body & glowing eyes
                ctx.fillStyle = skin.primary;
                ctx.beginPath();
                ctx.roundRect(-24, isSliding ? -8 : -18, 48, isSliding ? 16 : 26, 8);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(16, isSliding ? 0 : -14, 10, 0, Math.PI * 2);
                ctx.fill();
                // Glowing eyes
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(18, isSliding ? -2 : -16, 4, 3);
            }

            ctx.restore();
        }

        function draw() {
            ctx.save();

            if (shakeTimer > 0) {
                let offsetX = (Math.random() - 0.5) * shakeIntensity;
                let offsetY = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(offsetX, offsetY);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Parallax Pillars
            ctx.fillStyle = '#1e293b';
            backgroundPillars.forEach(p => {
                ctx.fillRect(p.x, canvas.height - p.height, p.width, p.height);
                ctx.fillStyle = '#334155';
                ctx.fillRect(p.x + 10, canvas.height - p.height + 40, p.width - 20, 10);
                ctx.fillStyle = '#1e293b';
            });

            // Tracks
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            tracks.forEach(ty => {
                ctx.beginPath();
                ctx.moveTo(0, ty + 20);
                ctx.lineTo(canvas.width, ty + 20);
                ctx.stroke();
            });

            // HUD
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`SCORE: ${score}m`, 25, 32);
            ctx.fillText(`🪙 ${totalCoins}`, 600, 32);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px sans-serif';
            ctx.fillText(`Animal Spirit: ${skins[currentSkinIndex].name} (Press C)`, 25, 395);

            // Coins
            coins.forEach(c => {
                let cY = tracks[c.track] + 10;
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(c.x, cY, c.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // OBSTACLES (Guaranteed Visible)
            obstacles.forEach(obs => {
                let obsY = tracks[obs.track] + 20;
                if (obs.type === 'spike') {
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(obs.x - 20, obsY);
                    ctx.lineTo(obs.x, obsY - 35);
                    ctx.lineTo(obs.x + 20, obsY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = '#f59e0b';
                    ctx.shadowColor = '#f59e0b';
                    ctx.shadowBlur = 12;
                    ctx.fillRect(obs.x - 22, obsY - 30, 44, 30);
                    ctx.shadowBlur = 0;
                }
            });

            // Draw Animal Character
            drawAnimal(player.x, player.y + 10, skins[currentSkinIndex], player.isSliding, frameCount);

            // Game Over
            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(6, 9, 19, 0.88)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('BEAST CRASHED!', canvas.width / 2, 160);

                ctx.fillStyle = '#f8fafc';
                ctx.font = '15px sans-serif';
                ctx.fillText(`Distance: ${score}m | Relics: ${totalCoins}`, canvas.width / 2, 210);

                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText('PRESS [ C ] TO CHANGE ANIMAL', canvas.width / 2, 270);
                ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, 310);
                ctx.textAlign = 'left';
            }

        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
